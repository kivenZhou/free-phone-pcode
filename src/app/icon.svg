  <rect x="16.5" y="12" width="3" height="4.5" rx="1" fill="#0a8a96"/>
  <rect x="12.5" y="18" width="7" height="2.5" rx="1" fill="#1a4a7a" fill-opacity="0.45"/>
  <!-- home indicator -->
